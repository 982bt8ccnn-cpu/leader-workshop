<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リーダー研修 ワークショップ - 回答用</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-xl mx-auto space-y-8">
    
    <!-- セクション1: 個人回答フォーム -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
      <h1 class="text-2xl font-bold mb-4 text-gray-800 border-b pb-2">個人回答の入力</h1>
      <p class="text-sm text-gray-600 mb-4">スクリーンにリアルタイム表示される回答を入力してください。</p>
      
      <div class="mb-4">
        <label class="block text-sm font-bold text-gray-700 mb-2">あなたの考え</label>
        <textarea id="personalInput" rows="3" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="意見を入力してください..."></textarea>
      </div>
      
      <button id="submitPersonalBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition">
        個人回答を投稿する
      </button>
    </div>

    <!-- セクション2: 班発表の回答フォーム -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
      <h2 class="text-2xl font-bold mb-2 text-gray-800 border-b pb-2">班発表内容の入力</h2>
      <p class="text-sm text-gray-600 mb-4">班で話し合った内容を入力し、提出してください（何度でも上書き送信できます）。</p>
      
      <div class="mb-4">
        <label class="block text-sm font-bold text-gray-700 mb-2">担当の班を選択</label>
        <select id="teamSelect" class="w-full p-3 border rounded-lg font-bold bg-gray-50 text-gray-800">
          <option value="team1">第 1 班</option>
          <option value="team2">第 2 班</option>
          <option value="team3">第 3 班</option>
          <option value="team4">第 4 班</option>
          <option value="team5">第 5 班</option>
        </select>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-blue-600 mb-1">① 私たちの班は、○○な時に○○すると考えました。</label>
          <input type="text" id="teamInput1" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="入力してください">
        </div>
        <div>
          <label class="block text-xs font-bold text-blue-600 mb-1">② 理由は○○だからです。</label>
          <input type="text" id="teamInput2" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="入力してください">
        </div>
        <div>
          <label class="block text-xs font-bold text-blue-600 mb-1">③ ただし、○○という問題も考えられます。</label>
          <input type="text" id="teamInput3" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="入力してください">
        </div>
        <div>
          <label class="block text-xs font-bold text-blue-600 mb-1">④ そのため、○○することが大切だと考えました。</label>
          <input type="text" id="teamInput4" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="入力してください">
        </div>
      </div>

      <button id="submitTeamBtn" class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition">
        班の回答を提出・更新する
      </button>
    </div>

  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ご自身のFirebase設定を入力してください
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. 個人回答の提出処理
    document.getElementById('submitPersonalBtn').addEventListener('click', async () => {
      const text = document.getElementById('personalInput').value.trim();
      if (!text) {
        alert('回答を入力してください');
        return;
      }

      try {
        await addDoc(collection(db, "answers"), {
          text: text,
          createdAt: serverTimestamp()
        });
        document.getElementById('personalInput').value = '';
        alert('個人回答を送信しました！');
      } catch (e) {
        console.error("エラー: ", e);
        alert('送信に失敗しました。');
      }
    });

    // 2. 班回答の提出処理
    document.getElementById('submitTeamBtn').addEventListener('click', async () => {
      const teamId = document.getElementById('teamSelect').value;
      const q1 = document.getElementById('teamInput1').value.trim();
      const q2 = document.getElementById('teamInput2').value.trim();
      const q3 = document.getElementById('teamInput3').value.trim();
      const q4 = document.getElementById('teamInput4').value.trim();

      if (!q1 || !q2 || !q3 || !q4) {
        alert('すべての項目を入力してください');
        return;
      }

      try {
        // teamSubmissions コレクション内に team1〜team5 のIDで保存（上書き可能）
        await setDoc(doc(db, "teamSubmissions", teamId), {
          q1: q1,
          q2: q2,
          q3: q3,
          q4: q4,
          updatedAt: serverTimestamp()
        });
        const teamNum = teamId.replace('team', '');
        alert(`第 ${teamNum} 班の回答を更新しました！`);
      } catch (e) {
        console.error("エラー: ", e);
        alert('班回答の送信に失敗しました。');
      }
    });
  </script>
</body>
</html>
